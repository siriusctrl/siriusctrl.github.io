<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Context, not control</title>
  <desc id="description">Human judgment defines a sparse context field for an agent workforce. One active trace passes through a quality gate to an outcome, with evaluation feeding a clean revision loop.</desc>
  <style>
    :root{
      --paper:#efeee9;
      --ink:#202321;
      --muted:#737873;
      --faint:#bfc2bc;
      --rule:#d2d2cc;
      --accent:#b63d34;
      --accent-soft:#e6cfca;
    }
    .paper{fill:var(--paper)}
    .frame,.guide,.boundary,.lane,.trace,.feedback,.tick,.bracket{fill:none;vector-effect:non-scaling-stroke}
    .frame{stroke:var(--rule);stroke-width:1}
    .guide{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 13}
    .boundary{stroke:var(--rule);stroke-width:1}
    .lane{stroke:var(--faint);stroke-width:1.4;stroke-linecap:round}
    .trace{stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .feedback{stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .tick{stroke:var(--muted);stroke-width:1.2}
    .bracket{stroke:var(--ink);stroke-width:1.5;stroke-linecap:square}
    .gate{fill:var(--accent)}
    .node{fill:var(--paper);stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
    .node.soft{stroke:var(--faint)}
    .node.active{fill:var(--accent);stroke:var(--accent)}
    .outcome-ring{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke}
    .outcome-dot{fill:var(--accent)}
    .label,.micro,.index,.lane-label{font-family:"Geist Mono","SFMono-Regular",Consolas,monospace;fill:var(--ink)}
    .label{font-size:17px;letter-spacing:.13em}
    .micro{fill:var(--muted);font-size:13px;letter-spacing:.11em}
    .index{fill:var(--muted);font-size:12px;letter-spacing:.12em}
    .lane-label{fill:var(--muted);font-size:12px;letter-spacing:.1em}
    .accent-text{fill:var(--accent)}

  </style>

  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect class="paper" width="1600" height="1000"/>
  <rect class="frame" x="44.5" y="44.5" width="1511" height="911"/>

  <text class="label" x="92" y="104">AGENT SYSTEM / 01</text>
  <text class="micro" x="1508" y="104" text-anchor="end">CONTEXT → OUTCOME</text>
  <path class="guide" d="M92 146H1508M92 854H1508"/>

  <text class="micro" x="150" y="238">HUMAN JUDGMENT</text>

  <g>
    <text class="index" x="150" y="344">01</text>
    <text class="label" x="205" y="344">GOAL</text>
    <path class="lane" d="M205 372H365"/>

    <text class="index accent-text" x="150" y="500">02</text>
    <text class="label accent-text" x="205" y="500">CONTEXT</text>
    <path class="trace" d="M205 528H365"/>

    <text class="index" x="150" y="656">03</text>
    <text class="label" x="205" y="656">EVALUATION</text>
    <circle class="node active" cx="212" cy="687" r="5"/>
    <path class="lane" d="M237 687H365"/>
  </g>

  <path class="bracket" d="M430 290H410V724H430"/>

  <rect class="boundary" x="500" y="220" width="610" height="540"/>
  <text class="micro" x="540" y="268">CONTEXT FIELD / AGENT WORKFORCE</text>
  <text class="index" x="1068" y="268" text-anchor="end">PERSISTENT</text>
  <path class="guide" d="M540 302H1070"/>

  <g>
    <text class="lane-label" x="540" y="383">AGENT 01</text>
    <path class="lane" d="M650 378H1040"/>
    <circle class="node soft" cx="742" cy="378" r="6"/>
    <circle class="node" cx="930" cy="378" r="6"/>

    <text class="lane-label accent-text" x="540" y="503">AGENT 02</text>
    <path class="lane" d="M650 528H1040"/>
    <circle class="node active" cx="742" cy="528" r="6"/>
    <circle class="node active" cx="930" cy="528" r="6"/>

    <text class="lane-label" x="540" y="683">AGENT 03</text>
    <path class="lane" d="M650 678H1040"/>
    <circle class="node" cx="742" cy="678" r="6"/>
    <circle class="node soft" cx="930" cy="678" r="6"/>
  </g>

  <path class="tick" d="M742 322V340M930 322V340"/>
  <text class="index" x="742" y="315" text-anchor="middle">ACT</text>
  <text class="index" x="930" y="315" text-anchor="middle">OBSERVE</text>

  <path class="trace" d="M365 528H742M742 528H930M930 528H1180"/>

  <rect class="gate" x="1178" y="348" width="4" height="360"/>
  <path class="tick" d="M1166 348H1194M1166 708H1194"/>
  <text class="micro accent-text" x="1180" y="318" text-anchor="middle">QUALITY GATE</text>

  <path class="trace" d="M1182 528H1310"/>
  <circle class="outcome-ring" cx="1380" cy="528" r="54"/>
  <circle class="outcome-dot" cx="1380" cy="528" r="10"/>
  <text class="label" x="1380" y="620" text-anchor="middle">OUTCOME</text>
  <text class="micro" x="1380" y="650" text-anchor="middle">EVIDENCE ATTACHED</text>

  <path class="feedback" d="M1180 678V790H330V687" marker-end="url(#arrow-accent)"/>
  <text class="micro accent-text" x="755" y="820" text-anchor="middle">FEEDBACK / RETRY</text>
</svg>
