<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Beyond linear chat</title>
  <desc id="description">A chronological transcript branches into stacked conversation cards and a small relationship graph before converging into a continuous article.</desc>
  <style>
    :root{
      --paper:#efeee9;
      --ink:#202321;
      --muted:#737873;
      --faint:#c5c6c0;
      --rule:#d2d2cc;
      --accent:#b63d34;
      --accent-soft:#e6cfca;
    }
    .paper{fill:var(--paper)}
    .frame,.guide,.timeline,.message,.card,.edge,.node,.article-rule{fill:none;vector-effect:non-scaling-stroke}
    .frame{stroke:var(--rule);stroke-width:1}
    .guide{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 12}
    .timeline{stroke:var(--muted);stroke-width:1.3}
    .message{stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
    .message.soft{stroke:var(--faint)}
    .message.active{stroke:var(--accent);stroke-width:2.5}
    .card{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
    .card.back{stroke:var(--rule)}
    .edge{stroke:var(--faint);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .edge.active{stroke:var(--accent);stroke-width:2.3}
    .node{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
    .node.active{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
    .article-rule{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
    .article-rule.soft{stroke:var(--faint)}
    .article-rule.active{stroke:var(--accent);stroke-width:2.3}
    .dot{fill:var(--ink)}
    .dot.active{fill:var(--accent)}
    .label,.micro,.index{font-family:"Geist Mono","SFMono-Regular",Consolas,monospace;fill:var(--ink)}
    .label{font-size:17px;letter-spacing:.13em}
    .micro{fill:var(--muted);font-size:13px;letter-spacing:.11em}
    .index{fill:var(--muted);font-size:12px;letter-spacing:.12em}
    .accent-text{fill:var(--accent)}
    .piece{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
    .transcript{animation:transcript-in 900ms cubic-bezier(.16,1,.3,1) 80ms both}
    .cards{animation:cards-in 1050ms cubic-bezier(.16,1,.3,1) 170ms both}
    .graph{animation:graph-in 1050ms cubic-bezier(.16,1,.3,1) 260ms both}
    .article{animation:article-in 1000ms cubic-bezier(.16,1,.3,1) 360ms both}
    .draw{stroke-dasharray:1500;animation:draw 1350ms cubic-bezier(.16,1,.3,1) 650ms both}
    @keyframes transcript-in{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
    @keyframes cards-in{from{opacity:0;transform:translate(-28px,34px) rotate(-1deg)}to{opacity:1;transform:none}}
    @keyframes graph-in{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
    @keyframes article-in{from{opacity:0;transform:translateX(52px)}to{opacity:1;transform:none}}
    @keyframes draw{from{stroke-dashoffset:1500}to{stroke-dashoffset:0}}

    @media(prefers-reduced-motion:reduce){.piece,.draw{animation:none}}
  </style>

  <rect class="paper" width="1600" height="1000"/>
  <rect class="frame" x="44.5" y="44.5" width="1511" height="911"/>
  <text class="label" x="92" y="104">LATTICE / NOTE 01</text>
  <text class="micro" x="1508" y="104" text-anchor="end">TIME → RELATION → EDITION</text>
  <path class="guide" d="M92 146H1508M92 854H1508"/>

  <g class="piece transcript">
    <text class="index" x="128" y="242">01 / TRANSCRIPT</text>
    <path class="timeline" d="M152 294V724"/>
    <circle class="node" cx="152" cy="324" r="8"/>
    <circle class="node" cx="152" cy="444" r="8"/>
    <circle class="node active" cx="152" cy="564" r="9"/>
    <circle class="node" cx="152" cy="684" r="8"/>
    <path class="message" d="M188 312H352M188 342H302"/>
    <path class="message soft" d="M188 432H382M188 462H326"/>
    <path class="message" d="M188 552H364M188 582H318"/>
    <path class="message active" d="M260 582H318"/>
    <path class="message soft" d="M188 672H342M188 702H286"/>
  </g>

  <path class="edge active draw" d="M318 582C372 582 374 494 434 494"/>

  <g class="piece cards">
    <text class="index" x="434" y="242">02 / LOCAL CARDS</text>
    <rect class="card back" x="412" y="346" width="360" height="390" transform="rotate(-1.2 592 541)"/>
    <rect class="card back" x="430" y="326" width="360" height="390" transform="rotate(-.6 610 521)"/>
    <rect class="card" x="450" y="304" width="360" height="390"/>
    <circle class="node" cx="500" cy="364" r="13"/>
    <path class="message soft" d="M530 354H678M530 377H626"/>
    <path class="message" d="M500 428H742M500 458H692M500 488H754"/>
    <path class="guide" d="M498 535H760"/>
    <circle class="node active" cx="500" cy="592" r="13"/>
    <path class="message" d="M530 580H724M530 607H654"/>
    <circle class="dot active" cx="742" cy="428" r="6"/>
  </g>

  <path class="edge active draw" d="M742 428C812 428 818 348 886 348"/>
  <path class="edge draw" d="M654 607C814 607 802 684 902 684"/>

  <g class="piece graph">
    <text class="index" x="858" y="242">03 / RELATION</text>
    <path class="edge active" d="M886 348C950 348 962 430 1018 466"/>
    <path class="edge" d="M902 684C964 684 966 532 1018 466"/>
    <path class="edge" d="M886 348L948 292M886 348L948 400M902 684L956 616M902 684L964 748"/>
    <path class="edge" d="M948 292L1024 326L1082 286M948 400L1018 466L1088 418M956 616L1018 466L1084 578M964 748L1032 682L1084 578"/>
    <circle class="node active" cx="886" cy="348" r="11"/><circle class="dot active" cx="886" cy="348" r="4"/>
    <circle class="node" cx="902" cy="684" r="10"/><circle class="dot" cx="902" cy="684" r="3.5"/>
    <circle class="node" cx="948" cy="292" r="8"/><circle class="node" cx="948" cy="400" r="8"/>
    <circle class="node" cx="956" cy="616" r="8"/><circle class="node" cx="964" cy="748" r="8"/>
    <circle class="node active" cx="1018" cy="466" r="12"/><circle class="dot active" cx="1018" cy="466" r="4"/>
    <circle class="node" cx="1024" cy="326" r="8"/><circle class="node" cx="1032" cy="682" r="8"/>
    <circle class="node" cx="1082" cy="286" r="8"/><circle class="node" cx="1088" cy="418" r="8"/>
    <circle class="node" cx="1084" cy="578" r="8"/>
  </g>

  <path class="edge active draw" d="M1018 466C1102 466 1114 500 1180 500"/>

  <g class="piece article">
    <text class="index" x="1190" y="242">04 / READING</text>
    <rect class="card" x="1180" y="286" width="280" height="464"/>
    <path class="article-rule active" d="M1222 338V426"/>
    <path class="article-rule" d="M1254 342H1410M1254 374H1372M1254 406H1420"/>
    <path class="article-rule" d="M1222 492H1408M1222 524H1360M1222 556H1418"/>
    <path class="article-rule soft" d="M1222 622H1390M1222 654H1342M1222 686H1404"/>
  </g>

  <text class="micro accent-text" x="800" y="908" text-anchor="middle">CONVERSATION PRESERVES THE PATH · THE ARTICLE PRESERVES THE ARGUMENT</text>
</svg>
