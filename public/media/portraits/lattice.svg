<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Lattice graph research portrait</title>
  <desc id="description">A layered conversation card, an inline follow-up, and a complete research graph connected by one active trace.</desc>
  <style>
    :root{--paper:#efeee9;--ink:#202321;--muted:#737873;--faint:#c5c6c0;--rule:#d2d2cc;--accent:#b63d34;--accent-soft:#e6cfca}
    .paper{fill:var(--paper)}.frame,.guide,.card,.line,.edge,.node,.orbit{fill:none;vector-effect:non-scaling-stroke}
    .frame{stroke:var(--rule);stroke-width:1}.guide{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 12}
    .card{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}.card.back{stroke:var(--rule)}
    .line{stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}.line.soft{stroke:var(--faint)}.line.accent{stroke:var(--accent);stroke-width:2.5}
    .edge{stroke:var(--faint);stroke-width:1.25}.edge.active{stroke:var(--accent);stroke-width:2.2}
    .node{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}.node.active{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
    .dot{fill:var(--ink)}.dot.accent{fill:var(--accent)}.orbit{stroke:var(--accent);stroke-width:1.4}
    .label,.micro,.thread-label{font-family:"Geist Mono","SFMono-Regular",Consolas,monospace;fill:var(--ink)}
    .label{font-size:17px;letter-spacing:.13em}.micro{fill:var(--muted);font-size:13px;letter-spacing:.11em}.thread-label{font-size:14px;letter-spacing:.07em}
    .accent-text{fill:var(--accent)}
    .piece{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
    .cards{animation:cards-in 1100ms cubic-bezier(.16,1,.3,1) 80ms both}
    .graph{animation:graph-in 1150ms cubic-bezier(.16,1,.3,1) 180ms both}
    .draw{stroke-dasharray:1500;animation:draw 1400ms cubic-bezier(.16,1,.3,1) 620ms both}
    .orbit{animation:pulse 2200ms ease-in-out 1500ms infinite}
    @keyframes cards-in{0%{opacity:0;transform:translate(-65px,42px) rotate(-1.2deg)}72%{opacity:1;transform:translate(4px,-3px)}100%{opacity:1;transform:none}}
    @keyframes graph-in{0%{opacity:0;transform:translate(70px,-28px)}72%{opacity:1;transform:translate(-4px,2px)}100%{opacity:1;transform:none}}
    @keyframes draw{from{stroke-dashoffset:1500}to{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:.28;transform:scale(.82)}50%{opacity:.85;transform:scale(1.08)}}
    @media(prefers-color-scheme:dark){:root{--paper:#1a1d1b;--ink:#e8e9e4;--muted:#9da39e;--faint:#454a46;--rule:#343835;--accent:#e0675c;--accent-soft:#57332f}}
    @media(prefers-reduced-motion:reduce){.piece,.draw,.orbit{animation:none}}
  </style>

  <rect class="paper" width="1600" height="1000"/>
  <rect class="frame" x="44.5" y="44.5" width="1511" height="911"/>
  <text class="label" x="92" y="102">LATTICE / TRACE</text>
  <text class="micro" x="1508" y="102" text-anchor="end">21 NODES · ONE ARTICLE</text>
  <path class="guide" d="M935 160V850M180 850H1420"/>

  <g class="piece cards">
    <rect class="card back" x="174" y="226" width="690" height="560" transform="rotate(-1.4 519 506)"/>
    <rect class="card back" x="192" y="210" width="690" height="560" transform="rotate(-.7 537 490)"/>
    <rect class="card" x="212" y="190" width="690" height="560"/>

    <circle class="node" cx="270" cy="252" r="17"/>
    <path class="line soft" d="M308 247H550M308 263H462"/>
    <path class="line" d="M270 322H760M270 355H815M270 388H694"/>
    <path class="line accent" d="M578 389H694"/>
    <path class="line" d="M270 435H824M270 468H735"/>

    <path class="guide" d="M258 520H856"/>
    <circle class="node" cx="270" cy="575" r="17"/>
    <text class="thread-label" x="270" y="580" text-anchor="middle">Q</text>
    <path class="line" d="M308 563H775M308 592H680"/>

    <rect class="card" x="258" y="628" width="560" height="82"/>
    <circle class="node active" cx="290" cy="669" r="16"/>
    <text class="thread-label accent-text" x="290" y="674" text-anchor="middle">L</text>
    <path class="line" d="M328 656H760M328 682H690"/>

    <circle class="dot accent" cx="695" cy="388" r="6"/>
    <path class="edge active draw" d="M695 388C870 385 920 434 1032 470"/>
    <text class="micro accent-text" x="270" y="724">CARD / FOLLOW-UP</text>
  </g>

  <g class="piece graph">
    <rect class="card" x="1010" y="190" width="380" height="560"/>
    <text class="micro" x="1048" y="236">COMPLETE GRAPH</text>
    <text class="micro" x="1352" y="236" text-anchor="end">FIXED MAP</text>
    <path class="guide" d="M1048 274H1352"/>

    <g class="draw">
      <path class="edge active" d="M1050 470L1110 345L1188 306"/>
      <path class="edge" d="M1050 470L1110 410L1188 392L1270 330L1340 300"/>
      <path class="edge" d="M1050 470L1110 470L1188 470L1270 430L1340 410"/>
      <path class="edge" d="M1050 470L1110 535L1188 548L1270 520L1340 490"/>
      <path class="edge" d="M1050 470L1110 608L1188 636L1270 610L1340 575"/>
      <path class="edge" d="M1110 345L1188 392M1110 410L1188 470M1110 535L1188 470M1110 608L1188 548"/>
      <path class="edge" d="M1188 306L1270 330M1188 392L1270 430M1188 470L1270 520M1188 548L1270 520M1188 636L1270 610"/>
      <path class="edge" d="M1270 330L1340 410M1270 430L1340 490M1270 520L1340 575M1270 610L1340 575"/>
    </g>

    <circle class="node" cx="1050" cy="470" r="10"/><circle class="dot" cx="1050" cy="470" r="3.5"/>
    <circle class="node active" cx="1110" cy="345" r="11"/><circle class="dot accent" cx="1110" cy="345" r="4"/>
    <circle class="orbit" cx="1110" cy="345" r="19"/>
    <circle class="node" cx="1110" cy="410" r="9"/><circle class="dot" cx="1110" cy="410" r="3"/>
    <circle class="node" cx="1110" cy="470" r="9"/><circle class="dot" cx="1110" cy="470" r="3"/>
    <circle class="node" cx="1110" cy="535" r="9"/><circle class="dot" cx="1110" cy="535" r="3"/>
    <circle class="node" cx="1110" cy="608" r="9"/><circle class="dot" cx="1110" cy="608" r="3"/>

    <circle class="node" cx="1188" cy="306" r="8"/><circle class="dot" cx="1188" cy="306" r="2.8"/>
    <circle class="node" cx="1188" cy="392" r="8"/><circle class="dot" cx="1188" cy="392" r="2.8"/>
    <circle class="node" cx="1188" cy="470" r="8"/><circle class="dot" cx="1188" cy="470" r="2.8"/>
    <circle class="node" cx="1188" cy="548" r="8"/><circle class="dot" cx="1188" cy="548" r="2.8"/>
    <circle class="node" cx="1188" cy="636" r="8"/><circle class="dot" cx="1188" cy="636" r="2.8"/>

    <circle class="node" cx="1270" cy="330" r="8"/><circle class="dot" cx="1270" cy="330" r="2.8"/>
    <circle class="node" cx="1270" cy="430" r="8"/><circle class="dot" cx="1270" cy="430" r="2.8"/>
    <circle class="node" cx="1270" cy="520" r="8"/><circle class="dot" cx="1270" cy="520" r="2.8"/>
    <circle class="node" cx="1270" cy="610" r="8"/><circle class="dot" cx="1270" cy="610" r="2.8"/>

    <circle class="node" cx="1340" cy="300" r="8"/><circle class="dot" cx="1340" cy="300" r="2.8"/>
    <circle class="node" cx="1340" cy="410" r="8"/><circle class="dot" cx="1340" cy="410" r="2.8"/>
    <circle class="node" cx="1340" cy="490" r="8"/><circle class="dot" cx="1340" cy="490" r="2.8"/>
    <circle class="node" cx="1340" cy="575" r="8"/><circle class="dot" cx="1340" cy="575" r="2.8"/>
    <circle class="node" cx="1340" cy="650" r="8"/><circle class="dot" cx="1340" cy="650" r="2.8"/>
    <circle class="node" cx="1270" cy="685" r="8"/><circle class="dot" cx="1270" cy="685" r="2.8"/>

    <text class="micro accent-text" x="1048" y="714">ACTIVE / SPACEX</text>
  </g>
</svg>
